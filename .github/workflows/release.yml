name: Release Native App

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'recursive'

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Make gradlew executable (Linux)
      if: runner.os == 'Linux'
      run: chmod +x libs/jediterm/gradlew

    - name: Build and install JediTerm (Linux)
      if: runner.os == 'Linux'
      run: ./gradlew :core:publishToMavenLocal :ui:publishToMavenLocal
      working-directory: libs/jediterm

    - name: Build and install JediTerm (Windows)
      if: runner.os == 'Windows'
      run: .\gradlew.bat :core:publishToMavenLocal :ui:publishToMavenLocal
      working-directory: libs/jediterm

    - name: Build jnc with Maven
      run: mvn -B package --file pom.xml

    - name: Package Native Executable with jpackage (Windows)
      if: runner.os == 'Windows'
      run: |
        jpackage --type app-image --name jNodeCommander --input target/jpackage-input --main-jar jnc.jar --main-class de.in.jnc.App --dest target/jpackage-dest
        Compress-Archive -Path target/jpackage-dest/jNodeCommander -DestinationPath target/jNodeCommander-Windows.zip

    - name: Package Native Executable with jpackage (Linux)
      if: runner.os == 'Linux'
      run: |
        jpackage --type app-image --name jNodeCommander --input target/jpackage-input --main-jar jnc.jar --main-class de.in.jnc.App --dest target/jpackage-dest
        cd target/jpackage-dest && tar -czf ../jNodeCommander-Linux.tar.gz jNodeCommander

    - name: Upload Release Assets (Windows)
      if: runner.os == 'Windows'
      uses: softprops/action-gh-release@v2
      with:
        files: target/jNodeCommander-Windows.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Release Assets (Linux)
      if: runner.os == 'Linux'
      uses: softprops/action-gh-release@v2
      with:
        files: target/jNodeCommander-Linux.tar.gz
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
