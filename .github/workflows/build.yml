name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'recursive'
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Make gradlew executable
      run: chmod +x libs/jediterm/gradlew
    - name: Build and install JediTerm (Gradle) to local Maven repo
      run: ./gradlew :core:publishToMavenLocal :ui:publishToMavenLocal
      working-directory: libs/jediterm
    - name: Build jnc with Maven
      run: mvn -B package --file pom.xml
