# Dependabot-Konfiguration für automatische Dependency-Updates
# Dokumentation: https://docs.github.com/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Maven-Abhängigkeiten der Haupt- pom.xml überwachen
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "maven"
    ignore:
      # JediTerm wird als Git-Submodul lokal gebaut;
      # Versions-Upgrades hierüber würden die Submodul-Referenz nicht aktualisieren.
      - dependency-name: "org.jetbrains.jediterm:*"

  # GitHub Actions – eigene Workflow-Abhängigkeiten aktuell halten
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    labels:
      - "dependencies"
      - "github-actions"
